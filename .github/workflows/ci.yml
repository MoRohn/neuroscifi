name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: lint, tests, JS checks, numerical reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 40   # a test that leaves processes holding the log pipe must not hold a runner for 6 hours
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv -p 3.12
      - run: uv pip install -p .venv/bin/python -e '.[dev,research,web,web-extract,crypto]'
      - run: .venv/bin/python -m playwright install --with-deps chromium
      # the runner's /usr/bin/chromium is a snap shim whose cold start exceeds the render timeout
      - run: echo "NSF_CHROMIUM=$(.venv/bin/python -c 'from playwright.sync_api import sync_playwright as p; m = p().start(); print(m.chromium.executable_path); m.stop()')" >> "$GITHUB_ENV"
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0   # Chromium's sandbox needs user namespaces (Ubuntu 24.04 runners restrict them); NeuroSciFi never disables the sandbox
      - run: bash scripts/check.sh

  acceptance:
    name: simulated first-release milestones
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv -p 3.12
      - run: uv pip install -p .venv/bin/python -e '.[dev]'
      - run: .venv/bin/nsf acceptance --all --out acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: acceptance.json

  e2e:
    name: browser end-to-end and accessibility (Chromium + axe-core)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv -p 3.12
      - run: uv pip install -p .venv/bin/python -e '.[dev,web,web-extract,crypto]'
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0   # Chromium's sandbox needs user namespaces (Ubuntu 24.04 runners restrict them); NeuroSciFi never disables the sandbox
      - run: PATH="$PWD/.venv/bin:$PATH" bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
