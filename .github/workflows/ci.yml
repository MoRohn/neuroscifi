name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: lint, tests, JS checks, numerical reproduction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv -p 3.12
      - run: uv pip install -p .venv/bin/python -e '.[dev,research]'
      - run: bash scripts/check.sh

  acceptance:
    name: simulated first-release milestones
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv -p 3.12
      - run: uv pip install -p .venv/bin/python -e '.[dev]'
      - run: .venv/bin/nsf acceptance --all --out acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance
          path: acceptance.json

  e2e:
    name: browser end-to-end and accessibility (Chromium + axe-core)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
      - run: uv venv .venv -p 3.12
      - run: uv pip install -p .venv/bin/python -e '.[dev]'
      - run: .venv/bin/python -m playwright install --with-deps chromium
      - run: PATH="$PWD/.venv/bin:$PATH" bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: test-results/
