[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscifi"
version = "0.7.0"
description = "NeuroSciFi: calibrated multimodal learning prototype, archives and Pocket field interface."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "zstandard==0.25.0"]

[project.optional-dependencies]
research = ["scipy==1.17.0"]
gpu = ["cupy-cuda13x[ctk]==14.2.0"]
dev = ["pytest==9.2.0", "ruff==0.17.6", "playwright==1.64.1"]
# Web Cortex (docs/web-cortex/DEPENDENCY_REVIEW.md). Parser only: scrapling[fetchers] is deliberately not used.
web = ["scrapling==0.5.1", "markdownify==1.2.4", "pypdf==7.1.1"]
web-extract = ["trafilatura==2.3.1"]
web-render = ["playwright==1.64.1"]
# Pocket Web Push (ADR-040: VAPID) and signed node identities, requests and Spark-signed results (ADR-042).
crypto = ["cryptography==50.0.2"]

[project.scripts]
nsf = "neuroscifi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"neuroscifi.pocket" = ["web/*"]
"neuroscifi.console" = ["web/*"]
"neuroscifi.presence" = ["web/*"]
"neuroscifi.voice" = ["web/*"]
"neuroscifi.webcortex" = ["bench/*.json"]
"neuroscifi.vendor_tufazip" = ["LICENSE", "NOTICE"]

[tool.ruff]
src = ["src", "tests"]
extend-exclude = ["research", "mobile/native"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["e2e", "js"]
markers = ["live: contacts the real internet; runs only with NSF_LIVE=1"]
